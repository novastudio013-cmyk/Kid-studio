name: Make kids video
on:
  schedule:
    - cron: "30 4 * * 2"   # Tuesday 10:00 IST  -> Short
    - cron: "30 4 * * 4"   # Thursday 10:00 IST -> Short
    - cron: "30 4 * * 0"   # Sunday 10:00 IST   -> longer video
  workflow_dispatch:
    inputs:
      format:
        description: "short or long"
        default: "short"
      kind:
        description: "optional: counting, colors, guess_animal or story (empty = automatic)"
        default: ""
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Make and upload (private)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IN_FORMAT: ${{ github.event.inputs.format }}
          IN_KIND: ${{ github.event.inputs.kind }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          FMT="$IN_FORMAT"
          if [ -z "$FMT" ]; then
            if [ "$SCHEDULE" = "30 4 * * 0" ]; then FMT=long; else FMT=short; fi
          fi
          if [ -n "$IN_KIND" ]; then
            python make_video.py --format "$FMT" --kind "$IN_KIND" --upload
          else
            python make_video.py --format "$FMT" --upload
          fi
      - name: Save topic history
        run: |
          git config user.name "kids-bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git commit -m "Update history" || echo "nothing to commit"
          git push || true
