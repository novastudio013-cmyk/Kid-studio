name: Make kids video (3D, manual)
on:
  workflow_dispatch:
    inputs:
      format:
        description: "short or long"
        default: "short"
      kind:
        description: "counting, colors, guess_animal or story (empty = automatic)"
        default: ""
      dry_run:
        description: "build but do not upload (true/false)"
        default: "true"
      quality:
        description: "draft | high | ultra"
        default: "high"
      languages:
        description: "comma separated, e.g. en,es,pt (empty = config default)"
        default: ""
permissions:
  contents: write
concurrency:
  group: kids-video          # never let two renders race on history.json
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install ffmpeg, fonts and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core xz-utils
          curl -sL -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.1-linux-x64.tar.xz
          mkdir -p $HOME/blender && tar xf /tmp/blender.tar.xz -C $HOME/blender --strip-components=1
          $HOME/blender/blender --version | head -2
          echo "BLENDER=$HOME/blender/blender" >> $GITHUB_ENV

      - name: Install Python deps
        run: |
          pip install -r studio/requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest studio/test_kids.py -q

      - name: Validate secrets before the long render
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        working-directory: studio
        continue-on-error: true
        run: python kids.py --check-credentials

      - name: Refresh analytics (best effort)
        working-directory: studio
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python analytics.py --refresh || echo "no analytics this run - planner stays neutral"

      - name: Decide and make video
        working-directory: studio
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IN_FORMAT: ${{ inputs.format }}
          IN_KIND: ${{ inputs.kind }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_QUALITY: ${{ inputs.quality }}
          IN_LANGS: ${{ inputs.languages }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          IN_KIND="$(echo "$IN_KIND" | tr '[:upper:]' '[:lower:]' | xargs)"
          # A manual run that names a kind bypasses the agent and builds exactly that.
          # Everything else goes through the agent, which decides what to make - or to skip.
          if [ -n "$IN_KIND" ] || [ -n "$IN_QUALITY" ] || [ -n "$IN_LANGS" ]; then
            FMT="${IN_FORMAT:-short}"
            ARGS="--format $FMT --kind ${IN_KIND:-story}"
            [ -n "$IN_QUALITY" ] && ARGS="$ARGS --quality $IN_QUALITY"
            [ -n "$IN_LANGS" ] && ARGS="$ARGS --languages $IN_LANGS"
            [ "$IN_DRY" = "true" ] && ARGS="$ARGS --dry-run" || ARGS="$ARGS --upload"
            echo "manual build: python kids.py $ARGS"
            python kids.py $ARGS
          else
            if [ "$IN_DRY" = "true" ]; then
              echo "agent (explain only)"; python agent.py --explain
            else
              echo "agent: decide -> build -> upload"; python agent.py --run
            fi
          fi

      - name: Keep logs and output when something breaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: |
            studio/output/**
            studio/history.json
            studio/agent_state.json
            studio/analytics.json
            studio/config.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save topic history
        if: always()
        run: |
          git config user.name "kids-bot"
          git config user.email "bot@users.noreply.github.com"
          git add studio/history.json studio/agent_state.json || true
          git diff --cached --quiet || git commit -m "Update history"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done
